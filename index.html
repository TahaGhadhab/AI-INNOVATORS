<!doctype html>
<html lang="fr" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title.home">AI INNOVATORS · IA &amp; Nature</title>
  <meta name="description" data-i18n-content="meta.desc.home" content="AI INNOVATORS, le club d’intelligence artificielle des étudiants. Thème 2026–27 : IA &amp; Nature. Projets, ateliers, certifications. Inscriptions ouvertes.">
  <meta name="theme-color" content="#04060a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI INNOVATORS · IA &amp; Nature">
  <meta property="og:description" content="Le club d’IA des étudiants. Thème 2026–27 : IA &amp; Nature. Inscriptions ouvertes.">
  <meta property="og:url" content="https://aiinnovators.vercel.app/">
  <meta property="og:image" content="https://aiinnovators.vercel.app/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/home.css">
  <script>
    document.documentElement.classList.add('js');
    // Safety net: never leave the page invisible if a script fails.
    setTimeout(function () { document.documentElement.classList.remove('i18n-pending'); }, 1500);
  </script>
  <noscript><style>html.i18n-pending body { opacity: 1; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

  <canvas class="atmosphere" data-atmosphere data-density="100" aria-hidden="true"></canvas>

  <!-- Icon sprite for the activity cards -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-detective" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.5 15.5L21 21"/><path d="M7.5 13.5c0-3.3 2.2-5.5 5.5-5.5 0 3.3-2.2 5.5-5.5 5.5zM7.5 13.5l3-3"/></symbol>
    <symbol id="i-doctor" viewBox="0 0 24 24"><path d="M10 21v-9"/><path d="M10 15c-4 0-6.5-2.5-7-6.5 4 0 6.5 2.5 7 6.5zM10 12c.4-4.2 3-7 7.5-7.5-.1 4.2-2.8 7-7.5 7.5z"/><path d="M13 18.5h2.2l1.3-2.5 1.7 5 1.3-2.5H22"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 16c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20.5c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M11 3h2.5M10.5 5h3.5l.5 2v4.5h-4.5V7z"/></symbol>
    <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18.2 3v3.8h-3.8M5.8 21v-3.8h3.8"/><path d="M9.5 14.5c0-2.8 2-4.8 5-4.8 0 2.8-2 4.8-5 4.8zM9.5 14.5l2.5-2.5"/></symbol>
    <symbol id="i-city" viewBox="0 0 24 24"><path d="M2.5 21h19"/><path d="M4.5 21V11h5v10M9.5 21V5.5h6V21M15.5 21v-7h4v7"/><path d="M12 9h1.5M12 12h1.5M12 15h1.5"/><path d="M17.5 11c0-2.2 1.2-3.6 3.5-4 0 2.2-1.2 3.6-3.5 4z"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6.5"/><path d="M8.5 14.5L7 22l5-2.6 5 2.6-1.5-7.5"/><path d="M9.3 9l1.8 1.8 3.6-3.6"/></symbol>
  </svg>

  <header class="site-nav" data-nav>
    <div class="site-nav__inner">
      <a class="brand" href="#top">
        <span class="brand__mark"><img class="brand__logo" src="assets/img/logo.webp" alt="" width="42" height="42" onerror="this.parentNode.classList.add('no-logo')"><svg class="brand__leaf" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 28V15" stroke="#8fe3a8" stroke-width="1.5" stroke-linecap="round"/><path d="M16 19c-5 0-8.5-3.4-9-8.5 5 0 8.5 3.4 9 8.5ZM16 15c.5-5 4-8.5 9-9-.1 5-3.6 8.6-9 9Z" stroke="#8fe3a8" stroke-width="1.5" stroke-linejoin="round"/><circle cx="7" cy="10.5" r="1.8" fill="#c9b6ff"/><circle cx="25" cy="6" r="1.8" fill="#c9b6ff"/><circle cx="16" cy="28" r="1.8" fill="#c9b6ff"/></svg></span>
        <span>AI Innovators</span>
      </a>
      <nav class="nav-links" id="nav-links" aria-label="Navigation">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#program" data-i18n="nav.program"></a>
        <a href="#projects" data-i18n="nav.activities"></a>
        <a class="btn btn--primary btn--sm" href="register.html" data-i18n="nav.register"></a>
      </nav>
      <div class="nav-actions">
        <div class="lang" role="group" data-i18n-aria="a11y.lang">
          <button type="button" data-lang-btn="fr" aria-pressed="true">FR</button>
          <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
        </div>
        <button class="menu-toggle" type="button" aria-controls="nav-links" aria-expanded="false" data-menu-toggle data-i18n-aria="a11y.menu" aria-label="Menu">
          <span class="menu-toggle__bar"></span><span class="menu-toggle__bar"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ============ HERO ============ -->
    <section class="hero" id="top">
      <div class="hero__veg" data-parallax="veg" aria-hidden="true">
        <div class="hero__veg-mask">
          <img src="assets/img/forest.png" alt="" width="1024" height="572" fetchpriority="high">
          <div class="hero__veg-tint"></div>
        </div>
        <div class="hero__pool"></div>
        <div class="hero__shade"></div>
      </div>

      <div class="hero__head" data-parallax="head">
        <img class="hero__logo" src="assets/img/logo.webp" alt="" width="128" height="128" onerror="this.remove()">
        <p class="eyebrow hero__eyebrow rise" style="--d:.25s"><span class="pulse-dot" aria-hidden="true"></span><span data-i18n="hero.eyebrow"></span></p>
        <h1 class="display hero__title reveal" style="--d:.35s" data-i18n-html="hero.title"></h1>
        <p class="hero__lead rise" style="--d:.6s" data-i18n="hero.lead"></p>
        <div class="hero__actions rise" style="--d:.72s">
          <a class="btn btn--primary" href="register.html"><span data-i18n="hero.cta"></span><span class="arrow" aria-hidden="true">→</span></a>
          <a class="btn btn--ghost" href="#program" data-i18n="hero.secondary"></a>
        </div>
        <p class="hero__note rise" style="--d:.82s" data-i18n="hero.note"></p>
      </div>

      <div class="hero__scroll" aria-hidden="true" data-i18n="hero.scroll"></div>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section container" id="about">
      <p class="eyebrow eyebrow--line reveal" data-i18n="about.eyebrow"></p>
      <div class="about__grid">
        <div class="about__col reveal">
          <h2 class="display h2" data-i18n-html="about.h1"></h2>
          <p class="lead" data-i18n="about.p1"></p>
        </div>
        <div class="about__col about__col--offset reveal" style="--d:.12s">
          <h2 class="display h2" data-i18n-html="about.h2"></h2>
          <p class="lead" data-i18n="about.p2"></p>
        </div>
      </div>

      <template id="tpl-stat">
        <li class="stat reveal"><span class="stat__value" data-field="value"></span><span class="stat__label" data-field="label"></span></li>
      </template>
      <ul class="stats" data-stagger="4" data-i18n-list="about.stats" data-template="tpl-stat"></ul>
    </section>

    <!-- ============ THEME STORY: flower → network ============ -->
    <section class="story" id="theme" data-stage>
      <div class="story__sticky">
        <div class="story__flower" data-flower aria-hidden="true">
          <div class="story__mask">
            <img src="assets/img/flower.jpg" alt="" loading="lazy" decoding="async">
            <div class="story__grain"></div>
            <div class="story__tint-bio"></div>
            <div class="story__tint" data-tint></div>
          </div>
        </div>
        <canvas class="story__veins" data-veins aria-hidden="true"></canvas>
        <h2 class="eyebrow story__label" data-i18n="story.label"></h2>
        <div class="story__captions">
          <div class="story__captions-box">
            <p class="story__cap story__cap--1" data-cap data-i18n="story.cap1"></p>
            <p class="story__cap story__cap--2" data-cap data-i18n="story.cap2"></p>
            <p class="story__cap story__cap--3" data-cap data-i18n="story.cap3"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ VALUES ============ -->
    <section class="section container values">
      <p class="eyebrow eyebrow--line reveal" data-i18n="values.eyebrow"></p>
      <h2 class="display values__title reveal" data-i18n-html="values.title"></h2>
      <template id="tpl-value">
        <li class="value reveal"><span class="value__index" data-index></span><span data-field="text"></span></li>
      </template>
      <ol class="values__list" data-i18n-list="values.list" data-template="tpl-value"></ol>
    </section>

    <!-- ============ PROGRAM ============ -->
    <section class="section container program" id="program">
      <div class="section-head">
        <div>
          <p class="eyebrow eyebrow--line reveal" data-i18n="program.eyebrow"></p>
          <h2 class="display h2 reveal" data-i18n-html="program.title"></h2>
        </div>
        <p class="lead reveal" style="--d:.1s" data-i18n="program.lead"></p>
      </div>

      <div class="timeline-wrap" data-timeline>
        <div class="timeline-rail" aria-hidden="true"><span class="timeline-fill"></span></div>
        <template id="tpl-season">
          <li class="season reveal">
            <span class="season__node" aria-hidden="true"></span>
            <div class="season__meta">
              <span class="season__index" data-index></span>
              <span class="season__name" data-field="season"></span>
              <span class="season__months" data-field="months"></span>
            </div>
            <div class="season__body">
              <h3 class="season__title" data-field="title"></h3>
              <p data-field="text"></p>
              <ul class="season__points" data-field="points"></ul>
            </div>
          </li>
        </template>
        <ol class="timeline" data-i18n-list="program.seasons" data-template="tpl-season"></ol>
      </div>
    </section>

    <!-- ============ PROJECTS ============ -->
    <section class="section container projects" id="projects">
      <div class="section-head">
        <div>
          <p class="eyebrow eyebrow--line reveal" data-i18n="projects.eyebrow"></p>
          <h2 class="display h2 reveal" data-i18n-html="projects.title"></h2>
        </div>
        <p class="lead reveal" style="--d:.1s" data-i18n="projects.lead"></p>
      </div>

      <template id="tpl-specimen">
        <li class="specimen reveal">
          <div class="specimen__top">
            <span class="specimen__no">N° <span data-index></span></span>
            <span class="specimen__tag" data-field="level"></span>
          </div>
          <svg class="specimen__icon" aria-hidden="true"><use data-field-attr="href:icon"></use></svg>
          <div class="specimen__body">
            <h3 class="specimen__title" data-field="title"></h3>
            <p class="specimen__text" data-field="text"></p>
          </div>
          <!-- mini preview: input → what the AI returns -->
          <div class="specimen__demo">
            <span class="specimen__in" data-field="input"></span>
            <span class="specimen__arrow" aria-hidden="true">→</span>
            <ul class="specimen__out" data-field="output"></ul>
          </div>
        </li>
      </template>
      <ul class="specimens" data-stagger="3" data-i18n-list="projects.items" data-template="tpl-specimen"></ul>

      <!-- Certifications -->
      <div class="certs reveal">
        <svg class="certs__icon" aria-hidden="true"><use href="#i-badge"></use></svg>
        <div class="certs__text">
          <h3 class="certs__title" data-i18n="certs.title"></h3>
          <p data-i18n="certs.text"></p>
        </div>
        <template id="tpl-cert"><li data-field="name"></li></template>
        <ul class="certs__list" data-i18n-list="certs.items" data-template="tpl-cert"></ul>
      </div>
    </section>

    <!-- ============ JOIN ============ -->
    <section class="join" id="join">
      <div class="join__rings" aria-hidden="true"></div>
      <p class="eyebrow reveal"><span class="pulse-dot" aria-hidden="true"></span><span data-i18n="join.eyebrow"></span></p>
      <h2 class="display join__title reveal" data-i18n-html="join.title"></h2>
      <p class="lead join__lead reveal" data-i18n="join.lead"></p>
      <div class="join__actions reveal">
        <a class="btn btn--primary btn--lg" href="register.html"><span data-i18n="join.cta"></span><span class="arrow" aria-hidden="true">→</span></a>
      </div>
      <template id="tpl-note"><li data-field="text"></li></template>
      <ul class="join__notes reveal" data-i18n-list="join.notes" data-template="tpl-note"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <a class="brand" href="#top">
          <span class="brand__mark"><img class="brand__logo" src="assets/img/logo.webp" alt="" width="42" height="42" onerror="this.parentNode.classList.add('no-logo')"><svg class="brand__leaf" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 28V15" stroke="#8fe3a8" stroke-width="1.5" stroke-linecap="round"/><path d="M16 19c-5 0-8.5-3.4-9-8.5 5 0 8.5 3.4 9 8.5ZM16 15c.5-5 4-8.5 9-9-.1 5-3.6 8.6-9 9Z" stroke="#8fe3a8" stroke-width="1.5" stroke-linejoin="round"/><circle cx="7" cy="10.5" r="1.8" fill="#c9b6ff"/><circle cx="25" cy="6" r="1.8" fill="#c9b6ff"/><circle cx="16" cy="28" r="1.8" fill="#c9b6ff"/></svg></span>
          <span>AI Innovators</span>
        </a>
        <p class="site-footer__motto" data-i18n-html="footer.motto"></p>
      </div>
      <div>
        <p class="footer-label" data-i18n="footer.club"></p>
        <ul class="footer-links">
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#program" data-i18n="nav.program"></a></li>
          <li><a href="#projects" data-i18n="nav.activities"></a></li>
          <li><a href="register.html" data-i18n="nav.register"></a></li>
        </ul>
      </div>
      <div>
        <p class="footer-label" data-i18n="footer.contact"></p>
        <!-- TODO: real email and social links -->
        <ul class="footer-links">
          <li><a href="mailto:contact@ai-innovators.club">contact@ai-innovators.club</a></li>
          <li><a href="#" rel="noopener">Instagram</a></li>
          <li><a href="#" rel="noopener">LinkedIn</a></li>
          <li><a href="#" rel="noopener">Discord</a></li>
        </ul>
      </div>
    </div>
    <div class="site-footer__bottom">
      <span>© <span data-year>2026</span> AI INNOVATORS · <span data-i18n="footer.school"></span></span>
      <span data-i18n="footer.theme"></span>
    </div>
  </footer>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/veins.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
